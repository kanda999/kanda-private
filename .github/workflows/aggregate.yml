name: Update _git_aggregated (addons materialized)

on:
  push:
    branches: [ "aggregate-config" ]
    paths:
      - "repos.yml"
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: aggregate-config
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GITHUB_TOKEN で push する場合に必要

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install git-aggregator pyyaml

      - name: Build addons and push to _git_aggregated
        env:
          # シンプル案：GITHUB_TOKEN で NNN-private に push
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: "_git_aggregated"
          COMMIT_MESSAGE: "update addons"
        run: python scripts/aggregate_to_branch.py repos.yml
